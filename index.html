<style>
  :root{
    --bg:#EFEBF2;
    --card:#FBFAFC;
    --ink:#241730;
    --ink-2:#6E5F78;
    --rule:#DCD4E2;
    --spark:#E0432D;
    --calm:#2A9583;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
  .shell{max-width:1120px;margin:0 auto;padding:0 26px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0 0;flex-wrap:wrap}
  .langs{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .langs button{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;background:none;border:0;
    border-right:1px solid var(--rule);padding:6px 14px;cursor:pointer;color:var(--ink-2);transition:background .16s,color .16s}
  .langs button:last-child{border-right:0}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}

  header{padding:40px 0 30px;border-bottom:1px solid var(--rule)}
  h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(28px,4.6vw,48px);line-height:1.18;letter-spacing:-.01em;max-width:20ch}
  .lede{margin-top:22px;max-width:58ch;font-size:15.5px;color:var(--ink-2);border-left:2px solid var(--spark);padding-left:16px}
  .meta{display:flex;gap:30px;flex-wrap:wrap;margin-top:26px}
  .meta div span{display:block;font-family:"Noto Sans SC";font-size:14px;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:3px}

  .wrap{display:grid;grid-template-columns:1fr 286px;gap:44px;align-items:start;padding:32px 0 80px}
  @media(max-width:920px){.wrap{grid-template-columns:1fr;gap:30px}}

  section{margin-bottom:30px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:14px;flex-wrap:wrap}

  .row{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:9px 0;border-bottom:1px dotted var(--rule)}
  .row:last-child{border-bottom:0}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .row .org{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:600;line-height:1.45}
  .row .org em{font-style:normal;font-family:"Noto Sans SC";font-size:13.5px;font-weight:300;color:var(--spark);margin-left:9px}
  .row .desc{font-size:13.5px;color:var(--ink-2);margin-top:2px;grid-column:1/2}
  .row .per{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap;padding-top:5px;text-align:right}

  .sheet{background:var(--card);border:1px solid var(--rule);display:flex;flex-direction:column}
  .sheet-head{padding:14px 22px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  #log{padding:24px 22px 6px;overflow-y:auto;max-height:60vh;min-height:340px}
  @media(max-width:920px){#log{max-height:none;min-height:280px}}
  .turn{margin-bottom:24px}
  .speaker{display:flex;gap:9px;align-items:baseline;margin-bottom:5px}
  .speaker b{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:600}
  .turn.her .speaker b{color:var(--spark)}
  .turn p{font-size:15px;white-space:pre-wrap}
  .turn.you p{color:var(--ink-2)}
  .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-2);margin-right:4px;animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
  @keyframes b{0%,60%,100%{opacity:.22}30%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.5}}
  .bar{border-top:1px solid var(--rule);padding:13px 18px;display:flex;gap:12px;align-items:flex-end}
  textarea{flex:1;resize:none;border:0;background:none;outline:none;font-family:"Noto Sans SC";font-size:15px;font-weight:300;color:var(--ink);line-height:1.6;max-height:118px}
  textarea::placeholder{color:#A79CAE}
  .send{border:0;background:var(--ink);color:var(--card);font-family:"Noto Sans SC";font-size:13px;padding:7px 17px;cursor:pointer;border-radius:2px;transition:opacity .16s;flex-shrink:0}
  .send:hover{opacity:.82}
  .send:disabled{opacity:.35;cursor:default}

  aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:20px}
  @media(max-width:920px){aside{position:static}}
  .box{background:var(--card);border:1px solid var(--rule);padding:16px 17px}
  .box h4{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:11px}
  .box dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
  .box dt{color:var(--ink-2);white-space:nowrap}
  .box dd a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
  .box dd a:hover{color:var(--spark);border-color:var(--spark)}
  .q{display:block;width:100%;text-align:left;cursor:pointer;background:none;border:0;border-left:2px solid var(--rule);
     padding:5px 0 5px 12px;margin-bottom:3px;font-family:"Noto Sans SC";font-size:13.5px;font-weight:300;color:var(--ink);
     line-height:1.55;transition:border-color .16s,padding .16s,color .16s}
  .q:hover,.q:focus-visible{border-left-color:var(--spark);padding-left:16px;color:var(--spark);outline:none}
  .note{font-size:12.5px;color:var(--ink-2);line-height:1.7}
  .ov{position:fixed;inset:0;background:rgba(36,23,48,.42);backdrop-filter:blur(3px);display:flex;
      align-items:center;justify-content:center;padding:24px;z-index:50;animation:fade .22s ease-out}
  .ov[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border:1px solid var(--rule);max-width:430px;width:100%;padding:26px 26px 22px;
         position:relative;animation:rise .26s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  @media(prefers-reduced-motion:reduce){.ov,.modal{animation:none}}
  .modal h3{font-family:"Noto Serif SC",serif;font-size:21px;font-weight:600;line-height:1.45;color:var(--spark);padding-right:22px}
  .modal .sub{font-size:13.5px;color:var(--ink-2);margin:10px 0 20px}
  .modal .x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:20px;line-height:1;
            color:var(--ink-2);cursor:pointer;padding:2px 5px}
  .modal .x:hover{color:var(--spark)}
  .f{display:flex;flex-direction:column;gap:9px}
  .f input,.f textarea{border:0;border-bottom:1px solid var(--rule);background:none;outline:none;padding:7px 1px;
    font-family:"Noto Sans SC";font-size:14px;font-weight:300;color:var(--ink);resize:none;transition:border-color .16s}
  .f input:focus,.f textarea:focus{border-bottom-color:var(--spark)}
  .f input::placeholder,.f textarea::placeholder{color:#A79CAE}
  .f .msg{font-size:12.5px;min-height:1.2em;margin-top:2px}
  .f .msg.bad{color:var(--spark)}
  .f .msg.ok{color:var(--calm)}
  .f .acts{display:flex;gap:10px;align-items:center;margin-top:6px}
  .f .later{background:none;border:0;color:var(--ink-2);font-family:"Noto Sans SC";font-size:13px;cursor:pointer;padding:6px 2px}
  .f .later:hover{color:var(--ink)}
  .contact-btn{width:100%;border:1px solid var(--ink);background:none;color:var(--ink);font-family:"Noto Sans SC";
    font-size:13.5px;padding:8px 0;cursor:pointer;border-radius:2px;transition:background .16s,color .16s}
  .contact-btn:hover{background:var(--ink);color:var(--card)}
  footer{border-top:1px solid var(--rule);padding:22px 0 56px;font-size:12.5px;color:var(--ink-2);max-width:66ch}
</style>

<div class="shell">
  <div class="top">
    <span class="mono" id="t-eyebrow"></span>
    <div class="langs" role="group">
      <button data-l="zh" aria-pressed="true">中文</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <header>
    <h1 id="t-title"></h1>
    <p class="lede" id="t-lede"></p>
    <div class="meta mono" id="t-meta"></div>
  </header>

  <div class="wrap">
    <main>
      <section>
        <div class="sec-h"><span class="mono" id="t-eduLabel"></span></div>
        <div id="t-edu"></div>
      </section>

      <section>
        <div class="sec-h">
          <span class="mono" id="t-expLabel"></span>
          <span class="mono" id="t-expHint" style="text-transform:none;letter-spacing:.02em;font-size:11.5px"></span>
        </div>
        <div id="t-exp"></div>
      </section>

      <section>
        <div class="sec-h"><span class="mono" id="t-campusLabel"></span></div>
        <div id="t-campus"></div>
      </section>

      <section style="margin-bottom:0">
        <div class="sec-h"><span class="mono" id="t-talkLabel"></span></div>
        <div class="sheet">
          <div class="sheet-head">
            <span class="mono" id="t-live"></span>
            <span class="mono" id="t-hint"></span>
          </div>
          <div id="log"></div>
          <div class="bar">
            <textarea id="input" rows="1"></textarea>
            <button class="send" id="send"></button>
          </div>
        </div>
      </section>
    </main>

    <aside>
      <div class="box"><h4 id="t-quickLabel"></h4><dl id="t-quick"></dl></div>
      <div class="box"><h4 id="t-askLabel"></h4><div id="t-qs"></div></div>
      <div class="box"><button class="contact-btn" id="openForm"></button></div>
      <div class="box"><h4 id="t-noteLabel"></h4><p class="note" id="t-note"></p></div>
    </aside>
  </div>

  <footer id="t-footer"></footer>
</div>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="x" id="closeForm" aria-label="close">&times;</button>
    <h3 id="f-title"></h3>
    <p class="sub" id="f-sub"></p>
    <div class="f">
      <input id="f-name" autocomplete="name">
      <input id="f-company">
      <input id="f-contact">
      <textarea id="f-msg" rows="2"></textarea>
      <div class="msg" id="f-msgline"></div>
      <div class="acts">
        <button class="send" id="f-submit"></button>
        <button class="later" id="f-later"></button>
      </div>
    </div>
  </div>
</div>

let L="zh", T=I18N.zh, history=[], busy=false, asked=0, eggShown=0;
const log=document.getElementById("log"), input=document.getElementById("input"), send=document.getElementById("send");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function row(e){
  return '<div class="row"><div><div class="org">'+esc(e.org)+(e.role?"<em>"+esc(e.role)+"</em>":"")+
    '</div><div class="desc">'+esc(e.desc)+'</div></div><span class="per">'+esc(e.period)+"</span></div>";
}

function render(){
  T=I18N[L]; document.documentElement.lang=L;
  $("t-eyebrow").textContent=T.eyebrow;
  $("t-title").textContent=T.title;
  $("t-lede").textContent=T.lede;
  $("t-meta").innerHTML=T.meta.map(m=>"<div>"+m[0]+"<span>"+m[1]+"</span></div>").join("");
  $("t-eduLabel").textContent=T.eduLabel;
  $("t-edu").innerHTML=T.edu.map(row).join("");
  $("t-expLabel").textContent=T.expLabel;
  $("t-expHint").textContent=T.expHint;
  $("t-exp").innerHTML=T.exp.map(row).join("");
  $("t-campusLabel").textContent=T.campusLabel;
  $("t-campus").innerHTML=T.campus.map(row).join("");
  $("t-talkLabel").textContent=T.talkLabel;
  $("t-live").textContent=T.live;
  $("t-hint").textContent=T.hint;
  input.placeholder=T.placeholder;
  send.textContent=T.sendLabel;
  $("t-quickLabel").textContent=T.quickLabel;
  $("t-quick").innerHTML=T.quick.map(q=>"<dt>"+q[0]+"</dt><dd>"+q[1]+"</dd>").join("");
  $("t-askLabel").textContent=T.askLabel;
  $("t-qs").innerHTML=T.qs.map(q=>'<button class="q">'+esc(q)+"</button>").join("");
  document.querySelectorAll(".q").forEach(b=>b.addEventListener("click",()=>ask(b.textContent)));
  $("t-noteLabel").textContent=T.noteLabel;
  $("t-note").textContent=T.note;
  $("openForm").textContent=T.form.openBtn;
  $("f-name").placeholder=T.form.name;
  $("f-company").placeholder=T.form.company;
  $("f-contact").placeholder=T.form.contact;
  $("f-msg").placeholder=T.form.msg;
  $("f-submit").textContent=T.form.submit;
  $("f-later").textContent=T.form.later;
  setModal(T.form.title,T.form.sub);
  $("f-msgline").textContent=""; $("f-msgline").className="msg";
  $("t-footer").textContent=T.footer;
  log.innerHTML=""; history=[]; asked=0; eggShown=0; addTurn("her",T.opening);
}

function addTurn(who,text){
  const el=document.createElement("div");
  el.className="turn "+(who==="her"?"her":"you");
  el.innerHTML='<div class="speaker"><b>'+(who==="her"?T.speakerHer:T.speakerYou)+"</b></div><p></p>";
  el.querySelector("p").textContent=text;
  log.appendChild(el); log.scrollTop=log.scrollHeight;
}

async function ask(text){
  text=(text||"").trim();
  if(busy||!text) return;
  busy=true; send.disabled=true;
  addTurn("you",text);
  history.push({role:"user",content:history.length===0?"[interface language: "+L+"]\n"+text:text});

  const wait=document.createElement("div");
  wait.className="turn her";
  wait.innerHTML='<div class="speaker"><b>'+T.speakerHer+'</b><span class="mono">'+T.waiting+
    '</span></div><p class="dots"><span></span><span></span><span></span></p>';
  log.appendChild(wait); log.scrollTop=log.scrollHeight;

  try{
    const res=await fetch("/api/chat",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history.slice(-12)})
    });
    const data=await res.json();
    const reply=(data.reply||"").trim();
    wait.remove();
    if(reply){ addTurn("her",reply); history.push({role:"assistant",content:reply}); }
    else addTurn("her",T.empty);
  }catch(e){ wait.remove(); addTurn("her",T.err); }
  busy=false; send.disabled=false; input.focus();

  asked++;
  if(asked===5 && eggShown===0){ eggShown=1; setTimeout(()=>openModal(T.egg),900); }
  else if(asked===11 && eggShown===1){ eggShown=2; setTimeout(()=>openModal(T.eggAgain),900); }
}

/* ---------- 联系表单 ---------- */
function setModal(title,sub){ $("f-title").textContent=title; $("f-sub").textContent=sub; }

function openModal(copy){
  if(copy) setModal(copy.title,copy.sub);
  $("f-msgline").textContent=""; $("f-msgline").className="msg";
  $("ov").hidden=false;
  setTimeout(()=>$("f-name").focus(),60);
}
function closeModal(){ $("ov").hidden=true; }

$("openForm").addEventListener("click",()=>openModal(T.form));
$("closeForm").addEventListener("click",closeModal);
$("f-later").addEventListener("click",closeModal);
$("ov").addEventListener("click",e=>{ if(e.target===$("ov")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("ov").hidden) closeModal(); });

$("f-submit").addEventListener("click",async()=>{
  const payload={
    name:$("f-name").value.trim(),
    company:$("f-company").value.trim(),
    contact:$("f-contact").value.trim(),
    message:$("f-msg").value.trim(),
    lang:L,
    at:new Date().toISOString()
  };
  const line=$("f-msgline");
  if(!payload.name || !payload.contact){
    line.textContent=T.form.need; line.className="msg bad"; return;
  }

  /* ↓↓↓ 二选一，把下面这行换成你自己的 ↓↓↓

     方案 A · FormSubmit（不用注册，把邮箱填进网址即可）：
       https://formsubmit.co/ajax/你的邮箱@163.com

     方案 B · Web3Forms（注册后拿一串 access key）：
       https://api.web3forms.com/submit
       并把下面 ACCESS_KEY 换成你的 key
  */
  const FORM_ENDPOINT = "https://formsubmit.co/ajax/violetdt0122@gmail.com";
  const ACCESS_KEY = "";

  const body = ACCESS_KEY ? {...payload, access_key:ACCESS_KEY} : payload;

  line.textContent="…"; line.className="msg";
  $("f-submit").disabled=true;

  let ok=false, detail="";
  try{
    const r=await fetch(FORM_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify(body)
    });
    const txt=await r.text();
    console.log("[form]",r.status,txt);
    ok=r.ok;
    if(!ok) detail=" ("+r.status+")";
  }catch(err){
    console.error("[form]",err);
    detail=" (network)";
  }

  $("f-submit").disabled=false;
  if(!ok){
    line.textContent=(L==="zh"?"发送失败，请直接邮件联系我":"Couldn't send — please email me directly")+detail;
    line.className="msg bad";
    return;
  }

  line.textContent=T.form.done; line.className="msg ok";
  setTimeout(()=>{ closeModal();
    ["f-name","f-company","f-contact","f-msg"].forEach(id=>$(id).value="");
    line.textContent=""; line.className="msg"; },2200);
});

document.querySelectorAll(".langs button").forEach(b=>{
  b.addEventListener("click",()=>{
    if(busy) return;
    L=b.dataset.l;
    document.querySelectorAll(".langs button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    render();
  });
});
send.addEventListener("click",()=>{const v=input.value;input.value="";input.style.height="auto";ask(v);});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();send.click();}});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,118)+"px";});
render();
</script>
